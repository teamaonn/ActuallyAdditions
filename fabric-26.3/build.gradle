plugins { id 'net.fabricmc.fabric-loom' version '1.18.2' }
version = '0.2.0-dev'
group = 'de.ellpeck.actuallyadditions'
base { archivesName = 'actuallyadditions-fabric-26.3' }
repositories {
    maven { url = 'https://maven.blamejared.com/'; content { includeGroup 'mezz.jei' } }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.twelveiterations.com/repository/maven-public/' }
}
dependencies {
    compileOnly 'mezz.jei:jei-26.3-fabric-api:31.17.0.108'
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.7+26.3'
    implementation 'net.blay09.mods:balm-fabric:26.3.0.1'
}
fabricApi { configureTests { createSourceSet = true; modId = 'actuallyadditions-power-test'; enableGameTests = true; enableClientGameTests = false } }
// Integration fixtures are external release JARs, never bundled in the mod.
dependencies {
    if (providers.gradleProperty('excompressum_jar').isPresent()) gametestImplementation files(providers.gradleProperty('excompressum_jar').get())
    if (providers.gradleProperty('omnia_jar').isPresent()) gametestImplementation files(providers.gradleProperty('omnia_jar').get())
}

java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { from('../LICENSE') }
